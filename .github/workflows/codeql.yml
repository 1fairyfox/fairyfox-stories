name: CodeQL

# SAST (supply-chain-hardening standard). Stories ships hand-written browser JS
# (assets/{coins,reader}.js and the reader chrome) plus the Node build/integrity
# scripts (scripts/*.mjs) — CodeQL analyzes all of it. Runs on PRs into main/dev,
# dev pushes, and a weekly cron so the Scorecard SAST signal stays green. No compiled
# build step: JS is interpreted, so init → analyze directly.
#
# Supply-chain hardening: top-level permissions read-only; the analyze job elevates only
# security-events: write; every `uses:` SHA-pinned with a version comment.
#
# NOTE (adoption 2026-07-25): the workflow exists; wiring it into `main` branch-protection
# required status checks is the Phase-2 gap tracked in notes/reference/adoption-manifest.md.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  schedule:
    - cron: "27 4 * * 1"   # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF results
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07   # v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07   # v3
