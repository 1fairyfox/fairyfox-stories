# Signed release — build provenance for each version tag.
#
# On a version tag this builds the Jekyll site, packages `_site` into a zip,
# attests keyless SLSA build provenance for it (OpenSSF Scorecard Signed-Releases),
# and publishes a GitHub Release with BOTH the artifact and the provenance
# `.intoto.jsonl` attached (Scorecard's Signed-Releases scores attestation alone as 0 —
# the provenance bundle must be a release asset).
#
# REACTS to a tag; does NOT create one. Tagging stays by hand, so pushing
# `vX.Y.Z` triggers this run.
#
# Supply-chain hardening: top-level permissions read-only; write is per-job; every
# `uses:` SHA-pinned with a version comment.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # keyless signing for provenance
      attestations: write   # write the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b   # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Package the site
        run: |
          cd _site
          zip -r "../fairyfox-stories-${GITHUB_REF_NAME}.zip" .
          cd ..

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373   # v4
        with:
          subject-path: "fairyfox-stories-*.zip"

      - name: Stage provenance bundle as a release asset
        run: cp "${{ steps.attest.outputs.bundle-path }}" "fairyfox-stories-${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Attach BOTH the site zip and the provenance bundle — Scorecard's
        # Signed-Releases needs the .intoto.jsonl as a release asset.
        run: gh release create "${GITHUB_REF_NAME}" fairyfox-stories-*.zip fairyfox-stories-*.intoto.jsonl --title "${GITHUB_REF_NAME}" --generate-notes
