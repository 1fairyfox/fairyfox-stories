name: Scorecard

# OpenSSF Scorecard (supply-chain-hardening standard) — the supply-chain health signal
# behind the Scorecard badge and the ship-contract's Scorecard ≥ 7.0 floor. Runs on the
# main branch, on branch-protection changes, and weekly; publishes results to the OpenSSF
# API (publish_results: true) so the shields.io badge populates, and uploads SARIF to
# GitHub code-scanning.
#
# Supply-chain hardening: top-level permissions read-all; the job elevates only what it
# needs; every `uses:` SHA-pinned with a version comment. A SCORECARD_TOKEN PAT is optional
# (only the Branch-Protection check needs it to read settings); without it that one check is
# skipped and the badge still works.

on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1"   # weekly, Mondays
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # publish results to the OpenSSF API
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc   # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07   # v3
        with:
          sarif_file: results.sarif
